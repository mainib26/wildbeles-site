<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hamus</title>
<meta name="description" content="The Eritrean & Ethiopian community marketplace." />
<meta property="og:title" content="Your business is on Hamus" />
<meta property="og:description" content="See your business and claim it free — Hamus, the Eritrean & Ethiopian community marketplace." />
<meta property="og:image" content="https://wildbeles.com/og-image.png" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<style>
  :root {
    --ground: #F6F1E7; --ground-2: #FBF8F1; --ink: #2B2420; --ink-soft: #6E635A;
    --green: #1E5B4B; --green-deep: #164438; --gold: #C6A14A; --terra: #C15A2E;
    --tint: #E9EFE9; --line: #E4DBC9; --shadow: 0 18px 44px -22px rgba(43,36,32,.45);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink);
    background: radial-gradient(1200px 500px at 50% -10%, rgba(30,91,75,.08), transparent 60%), var(--ground);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; padding: 28px 18px 40px; min-height: 100vh;
  }
  .wrap { width: 100%; max-width: 448px; }
  .eyebrow { display: flex; align-items: center; gap: 9px; justify-content: center;
    font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft);
    font-weight: 600; margin-bottom: 18px; }
  .eyebrow .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--green);
    color: var(--ground-2); display: grid; place-items: center; font-family: Georgia, serif;
    font-size: 14px; font-weight: 700; }
  .card { background: var(--ground-2); border: 1px solid var(--line); border-radius: 20px;
    overflow: hidden; box-shadow: var(--shadow); }
  .cover { background: radial-gradient(120% 140% at 85% -20%, rgba(198,161,74,.35), transparent 55%),
      linear-gradient(160deg, var(--green) 0%, var(--green-deep) 100%);
    color: #F7F3E8; padding: 30px 26px 26px; text-align: center; }
  .cover .kicker { font-size: 11.5px; letter-spacing: .18em; text-transform: uppercase;
    color: rgba(247,243,232,.72); font-weight: 600; margin: 0 0 12px; }
  .cover h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 600;
    font-size: clamp(30px, 8.5vw, 40px); line-height: 1.06; margin: 0; text-wrap: balance; }
  .rule { width: 46px; height: 3px; border-radius: 3px; background: var(--gold); margin: 15px auto 13px; }
  .cover .tagline { font-style: italic; color: rgba(247,243,232,.86); font-size: 15px; margin: 0;
    font-family: Georgia, serif; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 18px 22px 4px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
    font-size: 13px; font-weight: 600; background: var(--tint); color: var(--green-deep); border: 1px solid #d7e2d7; }
  .chip.loc { background: #F3ECDD; color: #7a5a2a; border-color: #eaddc2; }
  .section { padding: 16px 22px 4px; }
  .section h2 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft);
    font-weight: 700; margin: 0 0 11px; }
  .offerings { display: flex; flex-wrap: wrap; gap: 8px; }
  .offer { padding: 7px 12px; border-radius: 10px; background: #fff; border: 1px solid var(--line);
    font-size: 13.5px; font-weight: 500; color: var(--ink); }
  .actions { padding: 22px; display: grid; gap: 11px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 9px; padding: 15px 18px;
    border-radius: 13px; font-size: 16px; font-weight: 700; text-decoration: none; border: 1px solid transparent;
    cursor: pointer; }
  .btn-primary { background: var(--terra); color: #FDF7EF; box-shadow: 0 10px 22px -12px rgba(193,90,46,.8); }
  .btn-primary:active { transform: translateY(1px); }
  .stores { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-store { background: var(--ink); color: var(--ground-2); padding: 12px 10px; border-radius: 12px;
    font-size: 13.5px; line-height: 1.15; }
  .btn-store small { display: block; font-size: 10px; font-weight: 500; opacity: .7; letter-spacing: .04em; }
  .btn-store b { font-size: 15px; font-weight: 700; }
  .claim { text-align: center; padding: 4px 24px 26px; color: var(--ink-soft); font-size: 13.5px; }
  .claim b { color: var(--green-deep); }
  .foot { text-align: center; margin-top: 20px; font-size: 12px; color: var(--ink-soft); }
  .foot .dot { color: var(--gold); }
  .state { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
  [hidden] { display: none !important; }
  a:focus-visible, .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow"><span class="mark">ሓ</span> <span id="eyebrowText">Hamus</span></div>

    <div id="loading" class="state">Loading…</div>

    <div id="card" class="card" hidden>
      <div class="cover">
        <p class="kicker" id="kicker"></p>
        <h1 id="bizName"></h1>
        <div class="rule"></div>
        <p class="tagline" id="tagline"></p>
      </div>
      <div class="meta" id="meta"></div>
      <div class="section" id="offeringsSection" hidden>
        <h2>Services &amp; Products</h2>
        <div class="offerings" id="offerings"></div>
      </div>
      <div class="actions">
        <a class="btn btn-primary" id="openBtn" href="#">Open in Hamus</a>
        <div class="stores">
          <a class="btn btn-store" href="https://apps.apple.com/app/id6759566316"><small>Download on the</small><b>App Store</b></a>
          <a class="btn btn-store" href="https://play.google.com/store/apps/details?id=app.hamus.wildbeles"><small>Get it on</small><b>Google Play</b></a>
        </div>
      </div>
      <p class="claim"><b>Is this your business?</b> Open it in the Hamus app to claim it free and manage your page.</p>
    </div>

    <div class="foot">Hamus <span class="dot">·</span> the Eritrean &amp; Ethiopian community marketplace</div>
  </div>

<script>
  var SUPABASE_URL = 'https://avboayslfyoaqtmwbmjd.supabase.co';
  var PUBLISHABLE_KEY = 'sb_publishable_qhIsC7y-Wi-zvu1YskZjtg_fm7ogabd';
  var CAT = {
    events: ['🎉','Events & Decor'], catering: ['🍲','Catering'], bakery: ['🧁','Bakery'],
    'home-services': ['🔨','Home Services'], beauty: ['💄','Beauty & Glam'], photography: ['📸','Photography'],
    rentals: ['📦','Rentals'], restaurant: ['🍽','Restaurant'], cafe: ['☕','Cafe'], grocery: ['🛒','Grocery'],
    salon: ['💈','Salon'], retail: ['🛍','Retail'], church: ['⛪','Church'], services: ['💼','Services']
  };
  function $(id){ return document.getElementById(id); }
  function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text!=null) e.textContent = text; return e; }

  // id from ?id=<uuid> (robust: /hamus/business/ is a real index.html served
  // as text/html) or from a /hamus/business/<uuid> path (needs the _redirects
  // rewrite; kept as a fallback).
  var id = new URLSearchParams(location.search).get('id');
  if (!id) { var m = location.pathname.match(/\/business\/([A-Za-z0-9-]+)/); id = m ? m[1] : null; }

  function storeBtn(href, small, big) {
    var a = el('a', 'btn btn-store'); a.href = href;
    a.appendChild(el('small', null, small));
    a.appendChild(el('b', null, big));
    return a;
  }
  // No specific business (root / unknown path) — a plain "get the app" state.
  function showApp() {
    $('card').hidden = true;
    $('eyebrowText').textContent = 'Hamus';
    var s = el('div', 'state');
    var h = el('h2', null, 'The Eritrean & Ethiopian community marketplace');
    h.style.cssText = 'font-family:Georgia,serif;color:var(--ink);font-weight:600';
    var stores = el('div', 'stores'); stores.style.marginTop = '18px';
    stores.appendChild(storeBtn('https://apps.apple.com/app/id6759566316', 'Download on the', 'App Store'));
    stores.appendChild(storeBtn('https://play.google.com/store/apps/details?id=app.hamus.wildbeles', 'Get it on', 'Google Play'));
    s.appendChild(h); s.appendChild(stores);
    $('loading').replaceWith(s);
  }

  function render(b) {
    document.title = b.name + ' · Hamus';
    $('eyebrowText').textContent = "You've been added to Hamus";
    var cat = CAT[b.category] || ['🏷', (b.category || 'Business')];
    $('kicker').textContent = ((b.location ? cat[1] + ' · ' + b.location.split(',')[0] : cat[1]) || '').trim();
    $('bizName').textContent = b.name;
    // Tagline: first clause of the description, trimmed.
    if (b.description) {
      var tag = b.description.split('—')[0].split('. ')[0].trim();
      $('tagline').textContent = tag.length > 96 ? tag.slice(0, 93) + '…' : tag;
    } else { $('tagline').hidden = true; }

    var meta = $('meta');
    meta.appendChild(el('span','chip', cat[0] + ' ' + cat[1]));
    if (b.location) { var c = el('span','chip loc','📍 ' + b.location); meta.appendChild(c); }

    if (Array.isArray(b.offerings) && b.offerings.length) {
      $('offeringsSection').hidden = false;
      var box = $('offerings');
      b.offerings.slice(0, 24).forEach(function(o){ box.appendChild(el('span','offer', o)); });
    }

    var open = $('openBtn');
    open.addEventListener('click', function(e){ e.preventDefault(); window.location.href = 'hamus://business/' + id; });

    $('loading').hidden = true;
    $('card').hidden = false;
  }

  if (!id) {
    showApp();
  } else {
    var url = SUPABASE_URL + '/rest/v1/businesses?select=name,name_am,name_ti,category,location,offerings,description&id=eq.' + encodeURIComponent(id);
    fetch(url, { headers: { apikey: PUBLISHABLE_KEY } })
      .then(function(r){ return r.ok ? r.json() : []; })
      .then(function(rows){ if (rows && rows.length) render(rows[0]); else showApp(); })
      .catch(function(){ showApp(); });
  }
</script>
</body>
</html>
