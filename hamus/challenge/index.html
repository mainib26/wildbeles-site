<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hamus Challenge</title>
<meta name="description" content="Vote in the Hamus community challenge." />
<meta property="og:title" content="The Doro Wot Challenge — who makes the best?" />
<meta property="og:description" content="Post your doro wot, the community votes — winner takes a whole chicken + 12 eggs. Free on Hamus. Ends Aug 5." />
<!-- ✎ campaign og:image — update per challenge -->
<meta property="og:image" content="https://wildbeles.com/hamus/challenge/assets/doro-wot-cover.png" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<style>
  :root {
    --ground: #F6F1E7; --ground-2: #FBF8F1; --ink: #2B2420; --ink-soft: #6E635A;
    --green: #1E5B4B; --green-deep: #164438; --gold: #C6A14A; --terra: #C15A2E;
    --tint: #E9EFE9; --line: #E4DBC9; --shadow: 0 18px 44px -22px rgba(43,36,32,.45);
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink);
    background: radial-gradient(1200px 500px at 50% -10%, rgba(30,91,75,.08), transparent 60%), var(--ground);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; display: flex; justify-content: center; padding: 28px 18px 40px; min-height: 100vh; }
  .wrap { width: 100%; max-width: 448px; }
  .eyebrow { display: flex; align-items: center; gap: 9px; justify-content: center; font-size: 12px;
    letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; margin-bottom: 18px; }
  .eyebrow .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--terra); color: var(--ground-2);
    display: grid; place-items: center; font-family: Georgia, serif; font-size: 14px; font-weight: 700; }
  .card { background: var(--ground-2); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); }
  .cover { background: radial-gradient(120% 140% at 85% -20%, rgba(198,161,74,.3), transparent 55%),
      linear-gradient(160deg, var(--terra) 0%, #8A3423 100%); color: #F7F3E8; padding: 30px 26px 26px; text-align: center; position: relative; }
  .cover .kicker { font-size: 11.5px; letter-spacing: .18em; text-transform: uppercase; color: rgba(247,243,232,.82); font-weight: 700; margin: 0 0 12px; }
  .cover h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 600; font-size: clamp(28px, 8vw, 38px); line-height: 1.06; margin: 0; text-wrap: balance; }
  .rule { width: 46px; height: 3px; border-radius: 3px; background: var(--gold); margin: 15px auto 13px; }
  .cover .prize { font-style: italic; color: rgba(247,243,232,.92); font-size: 15px; margin: 0; font-family: Georgia, serif; }
  .prompt { padding: 16px 22px 6px; font-size: 14px; color: var(--ink-soft); text-align: center; line-height: 1.5; }
  .board { padding: 8px 18px 4px; display: grid; gap: 9px; }
  .entry { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 9px 12px; }
  .entry .rank { width: 22px; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; }
  .entry img { width: 54px; height: 54px; border-radius: 11px; object-fit: cover; background: var(--tint); }
  .entry .noimg { width: 54px; height: 54px; border-radius: 11px; background: var(--tint); }
  .entry .who { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry .votes { font-weight: 800; color: var(--green-deep); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .count { font-size: 13px; color: var(--ink-soft); text-align: center; padding: 6px; }
  .actions { padding: 20px 22px 8px; display: grid; gap: 11px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 9px; padding: 15px 18px; border-radius: 13px; font-size: 16px; font-weight: 700; text-decoration: none; border: 1px solid transparent; }
  .btn-primary { background: var(--terra); color: #FDF7EF; box-shadow: 0 10px 22px -12px rgba(193,90,46,.8); }
  .btn-store { background: var(--ink); color: var(--ground-2); padding: 12px 10px; border-radius: 12px; font-size: 13.5px; line-height: 1.15; width: 100%; text-align: center; }
  .btn-store small { display: block; font-size: 10px; font-weight: 500; opacity: .7; letter-spacing: .04em; }
  .btn-store b { font-size: 15px; font-weight: 700; }
  .soon { background: #F1EEE4; border: 1px solid var(--line); border-radius: 13px; padding: 16px 18px; text-align: center; }
  .soon-title { font-weight: 700; font-size: 15px; } .soon-body { margin-top: 5px; font-size: 13px; color: var(--ink-soft); }
  .hint { margin: 4px 2px 0; font-size: 12px; color: var(--ink-soft); line-height: 1.45; text-align: center; }
  .foot { text-align: center; margin-top: 20px; font-size: 12px; color: var(--ink-soft); }
  .foot .dot { color: var(--gold); }
  .state { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow"><span class="mark">ሓ</span> <span>Hamus Challenge</span></div>
    <div id="loading" class="state">Loading…</div>
    <div id="card" class="card" hidden>
      <div class="cover">
        <p class="kicker" id="deadline"></p>
        <h1 id="title"></h1>
        <div class="rule"></div>
        <p class="prize" id="prize"></p>
      </div>
      <p class="prompt" id="prompt"></p>
      <div class="board" id="board"></div>
      <div class="count" id="count"></div>
      <div class="actions" id="actions"></div>
      <p class="hint" style="padding:0 24px 22px">Voting happens in the app — one vote per person.</p>
    </div>
    <div class="foot">Hamus <span class="dot">·</span> the Eritrean &amp; Ethiopian community marketplace</div>
  </div>
<script>
  var SUPABASE_URL = 'https://avboayslfyoaqtmwbmjd.supabase.co';
  var PUBLISHABLE_KEY = 'sb_publishable_qhIsC7y-Wi-zvu1YskZjtg_fm7ogabd';
  function $(id){ return document.getElementById(id); }
  function el(t,c,x){ var e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e; }
  function isAndroid(){ return /Android/i.test(navigator.userAgent||''); }
  function isIOS(){ var u=navigator.userAgent||''; return /iPhone|iPad|iPod/i.test(u)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1); }
  function storeBtn(android){ var a=el('a','btn btn-store');
    a.href = android ? 'https://play.google.com/store/apps/details?id=app.hamus.wildbeles' : 'https://apps.apple.com/app/id6759566316';
    a.appendChild(el('small',null, android ? 'Get it on' : 'Download on the'));
    a.appendChild(el('b',null, android ? 'Google Play' : 'App Store')); return a; }
  // Device-aware "get the app to vote". Deep link into the challenge on the phone.
  function renderActions(box, challengeId){
    while(box.firstChild) box.removeChild(box.firstChild);
    var android=isAndroid(), ios=isIOS();
    if((ios||android) && challengeId){ var open=el('a','btn btn-primary'); open.href='hamus://challenges/'+challengeId; open.textContent='Open in Hamus to vote'; box.appendChild(open); }
    box.appendChild(storeBtn(android));
    if(!ios && !android) box.appendChild(el('p','hint','Hamus is on iPhone & Android — open this on your phone, or search "Hamus" in the App Store or Google Play.'));
  }
  function daysLeft(endsAt){ var ms=new Date(endsAt)-new Date(); if(ms<=0) return 'Challenge ended';
    var d=Math.floor(ms/86400000), h=Math.floor((ms%86400000)/3600000); return (d>0? d+' days left' : h+'h left'); }
  var slug = new URLSearchParams(location.search).get('slug');
  function render(c){
    if(!c){ $('loading').textContent = 'Challenge not found.'; return; }
    document.title = c.title + ' · Hamus Challenge';
    // Campaign cover art (challenges.cover_image_url) as the hero, with a dark
    // wash so the white text stays readable over any image.
    if(c.cover){
      var cv=document.querySelector('.cover');
      cv.style.backgroundImage='linear-gradient(rgba(12,42,37,.45), rgba(12,42,37,.66)), url("'+c.cover+'")';
      cv.style.backgroundSize='cover'; cv.style.backgroundPosition='center';
    }
    $('deadline').textContent = c.status==='winner_confirmed' ? 'Winner announced' : daysLeft(c.ends_at);
    $('title').textContent = c.title;
    $('prize').textContent = '🏆 ' + c.prize;
    $('prompt').textContent = c.prompt;
    var board=$('board'); var entries=c.entries||[];
    entries.slice(0,20).forEach(function(e,i){
      var row=el('div','entry'); row.appendChild(el('span','rank','#'+(i+1)));
      if(e.image){ var im=document.createElement('img'); im.src=e.image; im.alt=''; row.appendChild(im); } else { row.appendChild(el('div','noimg')); }
      var who=el('span','who', (e.author||'Someone') + (c.winner_entry_id===e.id?'  🏆':'')); row.appendChild(who);
      row.appendChild(el('span','votes', (e.votes||0)+' ♥')); board.appendChild(row);
    });
    $('count').textContent = entries.length + (entries.length===1?' entry':' entries');
    renderActions($('actions'), c.id);
    $('loading').hidden = true; $('card').hidden = false;
  }
  if(!slug){ $('loading').textContent = 'No challenge specified.'; }
  else {
    fetch(SUPABASE_URL+'/rest/v1/rpc/public_challenge_view', {
      method:'POST', headers:{ apikey:PUBLISHABLE_KEY, 'Content-Type':'application/json' }, body: JSON.stringify({ p_slug: slug })
    }).then(function(r){ return r.ok ? r.json() : null; }).then(render).catch(function(){ $('loading').textContent='Could not load.'; });
  }
</script>
</body>
</html>
